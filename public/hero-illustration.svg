<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdeef0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f9dce3;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Breast outline (soft, abstract) -->
  <path
    d="M90 40 Q60 40 50 60 Q40 80 50 100 Q60 120 80 110 Q100 100 110 80 Q120 60 110 40 Q110 25 90 25 Q70 25 90 40 Z"
    fill="url(#pinkGrad)"
    stroke="#ec6a8f"
    strokeWidth="2"
    filter="url(#softShadow)"
  />
  <!-- Nipple area -->
  <circle cx="70" cy="70" r="8" fill="#d98bc9" />
  <!-- Heart shape -->
  <path
    d="M130 50 Q140 30 150 40 Q160 50 150 60 Q140 70 130 80 Q120 70 110 60 Q100 50 110 40 Q120 30 130 50 Z"
    fill="#ec6a8f"
    opacity="0.6"
  />
  <!-- Decorative dots -->
  <circle cx="30" cy="150" r="4" fill="#ec6a8f" opacity="0.4" />
  <circle cx="170" cy="160" r="3" fill="#d98bc9" opacity="0.5" />
  <circle cx="150" cy="130" r="5" fill="#ec6a8f" opacity="0.3" />
  <circle cx="40" cy="180" r="3" fill="#d98bc9" opacity="0.4" />
</svg>
